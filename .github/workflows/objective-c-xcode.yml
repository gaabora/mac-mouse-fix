name: Xcode - Multi Variant Build & Analyze

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    name: Build ${{ matrix.scheme }} (${{ matrix.arch }} - ${{ matrix.config }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [ "App", "App - Release", "Helper", "Helper - Release" ]
        config: [ "Debug", "Release" ]
        arch: [ "x86_64", "arm64" ]

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Verify available schemes
        run: xcodebuild -list -project "Mouse Fix.xcodeproj"

      - name: Build ${{ matrix.scheme }}
        run: |
          echo "Building scheme: ${{ matrix.scheme }}"
          echo "Configuration: ${{ matrix.config }}"
          echo "Architecture: ${{ matrix.arch }}"

          # Determine whether to use .xcworkspace or .xcodeproj
          if ls *.xcworkspace 1>/dev/null 2>&1; then
            filetype_parameter="workspace"
            file_to_build=$(ls *.xcworkspace | head -1)
          else
            filetype_parameter="project"
            file_to_build=$(ls *.xcodeproj | head -1)
          fi

          echo "Building $file_to_build ($filetype_parameter)"

          # Perform the build
          xcodebuild clean build analyze \
            -${filetype_parameter} "$file_to_build" \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.config }}" \
            -destination "platform=macOS,arch=${{ matrix.arch }},name=Any Mac" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Report status
        if: always()
        run: echo "Finished build for ${{ matrix.scheme }} (${{ matrix.config }}, ${{ matrix.arch }})"
