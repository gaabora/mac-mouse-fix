name: Xcode - Multi Variant Build & Upload

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    name: Build ${{ matrix.scheme }} (${{ matrix.arch }} - ${{ matrix.config }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [ "App - Release", "Helper - Release" ]
        config: [ "Release" ]
        arch: [ "x86_64" ]
        # scheme: [ "App", "App - Release", "Helper", "Helper - Release" ]
        # config: [ "Debug", "Release" ]
        # arch: [ "x86_64", "arm64" ]

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Build ${{ matrix.scheme }}
        run: |
          echo "Building scheme: ${{ matrix.scheme }}"
          echo "Configuration: ${{ matrix.config }}"
          echo "Architecture: ${{ matrix.arch }}"

          # Detect .xcworkspace or .xcodeproj safely, handling spaces
          file_to_build=""
          if compgen -G "*.xcworkspace" > /dev/null; then
            while IFS= read -r f; do file_to_build="$f"; break; done < <(find . -maxdepth 1 -name "*.xcworkspace" -print)
            filetype_parameter="workspace"
          else
            while IFS= read -r f; do file_to_build="$f"; break; done < <(find . -maxdepth 1 -name "*.xcodeproj" -print)
            filetype_parameter="project"
          fi

          echo "Detected build container: '$file_to_build' ($filetype_parameter)"

          build_dir="${{ github.workspace }}/build/${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}"
          mkdir -p "$build_dir"

          # Run build with correct quoting
          xcodebuild clean build \
            -${filetype_parameter} "$file_to_build" \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.config }}" \
            -destination "platform=macOS,arch=${{ matrix.arch }},name=Any Mac" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="$build_dir" \
            | xcpretty

          echo "Build finished for ${{ matrix.scheme }} - checking outputs:"
          find "$build_dir" -type d -name "*.app" || echo "No .app found"

      - name: Zip built app (if exists)
        if: success()
        run: |
          build_dir="${{ github.workspace }}/build/${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}"
          app_path=$(find "$build_dir" -type d -name "*.app" | head -1 || true)
          if [ -n "$app_path" ]; then
            echo "Zipping: $app_path"
            cd "$(dirname "$app_path")"
            zip -r "${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}.zip" "$(basename "$app_path")"
          else
            echo "⚠️ No .app found to zip"
          fi

      - name: Upload .app (zipped)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}
          path: |
            build/**/${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}.zip
