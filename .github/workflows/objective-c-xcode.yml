name: Xcode Build x86_64

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    name: Build Helper + App (x86_64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Derived Data & Module Cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Developer/Xcode/ModuleCache.noindex/*

      - name: Set up build directory
        run: mkdir -p build

      - name: Detect project/workspace
        id: detect
        run: |
          if compgen -G "*.xcworkspace" > /dev/null; then
            echo "filetype=workspace" >> $GITHUB_OUTPUT
            file=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
            echo "file=$file" >> $GITHUB_OUTPUT
          else
            echo "filetype=project" >> $GITHUB_OUTPUT
            file=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
            echo "file=$file" >> $GITHUB_OUTPUT
          fi
          echo "Detected $filetype: $file"

      - name: Build Helper first
        run: |
          build_dir="$PWD/build/Helper-Release-x86_64"
          mkdir -p "$build_dir"
          xcodebuild clean build \
            -${{ steps.detect.outputs.filetype }} "${{ steps.detect.outputs.file }}" \
            -scheme "Mac Mouse Fix Helper" \
            -configuration "Release" \
            -destination "platform=macOS,arch=x86_64,name=My Mac" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            BUILD_DIR="$build_dir" \
            | xcpretty

      - name: Build App next
        run: |
          build_dir="$PWD/build/App-Release-x86_64"
          mkdir -p "$build_dir"
          xcodebuild clean build \
            -${{ steps.detect.outputs.filetype }} "${{ steps.detect.outputs.file }}" \
            -scheme "App - Release" \
            -configuration "Release" \
            -destination "platform=macOS,arch=x86_64,name=My Mac" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            BUILD_DIR="$build_dir" \
            | xcpretty

      - name: Zip built apps
        run: |
          for app in build/*-x86_64/Release/*.app; do
            echo "Zipping $app"
            pushd "$(dirname "$app")"
            zip -r "$(basename "$app").zip" "$(basename "$app")"
            popd
          done

      - name: Upload built apps
        uses: actions/upload-artifact@v4
        with:
          name: MacMouseFix-x86_64
          path: build/*-x86_64/Release/*.app.zip
