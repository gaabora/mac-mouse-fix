name: Xcode - Multi Variant Build & Upload

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  build:
    name: Build ${{ matrix.scheme }} (${{ matrix.arch }} - ${{ matrix.config }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [ "App - Release", "Helper - Release" ]
        config: [ "Release" ]
        arch: [ "x86_64" ]
        # scheme: [ "App", "App - Release", "Helper", "Helper - Release" ]
        # config: [ "Debug", "Release" ]
        # arch: [ "x86_64", "arm64" ]

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode info
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Build ${{ matrix.scheme }}
        run: |
          echo "Building scheme: ${{ matrix.scheme }}"
          echo "Configuration: ${{ matrix.config }}"
          echo "Architecture: ${{ matrix.arch }}"

          # Detect whether to use workspace or project
          if ls *.xcworkspace 1>/dev/null 2>&1; then
            filetype_parameter="workspace"
            file_to_build=$(ls *.xcworkspace | head -1)
          else
            filetype_parameter="project"
            file_to_build=$(ls *.xcodeproj | head -1)
          fi

          echo "Building $file_to_build ($filetype_parameter)"

          # Perform the build
          xcodebuild clean build \
            -${filetype_parameter} "$file_to_build" \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.config }}" \
            -destination "platform=macOS,arch=${{ matrix.arch }},name=Any Mac" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="${{ github.workspace }}/build/${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}" \
            | xcpretty

      - name: Upload built app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.scheme }}-${{ matrix.config }}-${{ matrix.arch }}/Build/Products/${{ matrix.config }}/*.app
